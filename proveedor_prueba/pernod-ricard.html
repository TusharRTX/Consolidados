<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect – Consolidados 2028</title>

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --btn: #2563eb;
  --btn-disabled: #9ca3af;
  --locales-bg: #eef2ff;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); }

/* HEADER */
header {
  background: var(--primary);
  color: white;
  padding: 14px;
  text-align: center;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
header img { height: 24px; }

/* WRAPPER */
.wrapper { max-width: 760px; margin: 24px auto; padding: 0 14px; }

/* PROVIDER BAR */
.provider-bar {
  background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
  display: flex; justify-content: space-between; gap: 10px;
}
.provider-name { font-weight: 700; }
.provider-date { font-size: 12px; color: var(--muted); }

/* FILTRO GLOBAL */
.filter-box {
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 18px;
  box-shadow: 0 6px 16px rgba(0,0,0,.12);
}
.filter-box input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 13px;
}

/* CARDS */
.card {
  background: var(--panel); border-radius: 18px;
  box-shadow: 0 10px 26px rgba(0,0,0,.18);
  overflow: hidden; margin-bottom: 22px;
}
.grid-main { display: grid; grid-template-columns: 1fr 1fr; }
.cell { min-width: 0; padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.grid-main > .cell:nth-child(odd) { border-right: 1px solid var(--border); }
.grid-main > .cell:nth-last-child(-n + 2) { border-bottom: none; }
.label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.value { font-weight: 600; }

/* BOTONES */
.btn {
  display: inline-block; width: 100%; padding: 8px;
  text-align: center; background: var(--btn); color: white;
  border-radius: 10px; font-weight: 600; text-decoration: none;
  font-size: 12px;
}
.btn.disabled { background: var(--btn-disabled); cursor: not-allowed; }

/* PREVIEW IMG */
.preview-img {
  width: 100%;
  border-radius: 8px;
  margin-bottom: 6px;
  object-fit: cover;
  max-height: 70px;
}

/* LOCALES BTN */
.locales-row { border-top: 1px solid var(--border); padding: 14px; }
.locales-btn {
  width: 100%; padding: 10px; background: var(--locales-bg);
  color: var(--primary); border-radius: 12px; font-weight: 600;
  text-align: center; cursor: pointer; font-size: 13px;
}

/* MODAL */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; justify-content: center; align-items: flex-end; }
.modal-content { background: white; width: 100%; max-height: 85vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; }
.modal-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: 600; }
.modal-body { padding: 14px 16px; overflow-y: auto; }
.modal-body input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); }
.locales-list { list-style: none; padding: 0; margin: 0; }
.locales-list li { padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }

@media (min-width: 769px) {
  .modal { align-items: center; }
  .modal-content { width: 520px; border-radius: 16px; }
}
</style>
</head>

<body>

<header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/1/14/Walmart_Connect_logo.png"/>
  Walmart Connect · Consolidados
</header>

<div class="wrapper">

  <div class="provider-bar">
    <div class="provider-name" id="providerName">Proveedor</div>
    <div class="provider-date" id="providerVigencia">Vigencia</div>
  </div>

  <div class="filter-box">
    <input type="text" id="filtroGlobal" placeholder="Buscar local (23, lider, hyper...)" />
  </div>

  <div id="cardsRoot"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modalLocales">
  <div class="modal-content">
    <div class="modal-header">
      <span>Locales asociados</span>
      <span id="btnCloseModal" style="cursor:pointer;">×</span>
    </div>
    <div class="modal-body">
      <input type="text" id="inputBuscar" placeholder="Buscar local..." />
      <ul class="locales-list" id="listaLocales"></ul>
    </div>
  </div>
</div>

<script>
const __PROVIDER__       = {"proveedor": "Pernod Ricard", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)"};
const elementos          = [{"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "ESPIRITUOSOS", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/hOW0JiBpNeim-Foto-montaje-Beefeater-generico.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/V0UqlNO8siG0-Foto-montaje-Beefeater-generico.jpg", "localesCsv": "182"}, {"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "LICORES", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/vBZVyl0pAlEq-Foto-montaje-Rmz-generico.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/sNLVYLn5FzGj-Foto-montaje-Rmz-generico.jpg", "localesCsv": "32, 36, 44, 45, 46, 49, 55, 58, 62, 71, 72, 73, 75, 76, 78, 79, 81, 83, 84, 85, 88, 89, 91, 92, 94, 96, 97, 99, 182, 425, 426, 456, 457, 459, 518, 602, 607, 618, 620, 626, 632, 654, 655, 670, 679, 684, 686, 697, 736"}, {"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "ESPIRITUOSOS", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/qYiKDCintBSr-Foto-montaje-Ballantines-generico.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/eT9BpA8gmi8S-Foto-montaje-Ballantines-generico.jpg", "localesCsv": "32, 33, 36, 38, 41, 42, 58, 62, 72, 81, 88, 89, 94, 96, 97, 99, 120, 182, 425, 456, 457, 518, 602, 618, 620, 626, 632, 655, 679, 682, 686, 693, 736, 747"}, {"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "LICORES", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/hRKXMVfNiKyi-Foto-montaje-RMZ.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/qkPyBMRJ7TPU-Key-Visual-RMZ.png", "localesCsv": "32, 35, 36, 38, 41, 42, 45, 46, 48, 49"}, {"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "ESPIRITUOSOS", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/B4OwYliEwBvM-Foto-montaje-Beefeater.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/1nhsS0tWy0kL-Key-Visual-Beefeater.jpg.png", "localesCsv": "39, 49, 57, 75, 76, 79, 84, 85, 88, 126, 127, 457, 618, 654, 670, 679, 686, 697, 736"}, {"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "LICORES", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/Jxe6IALfnOyZ-Fotomontaje-Buhero-Negro.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/tFRCQKIFgGm2-Key-visual-Buhero-Negro.jpg", "localesCsv": "35, 38, 41, 48, 55, 75, 79, 81, 88, 95, 96, 98, 618, 679, 747"}, {"nombre": "LATERAL CABECERA CONGELADOS", "medidas": "MÁXIMO: 100x200 cm.", "piezas": 1, "categoria": "ESPIRITUOSOS", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/pNDLlciEnWev-Cabecera-Beefeater.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/mZNX7KB9c9za-Key-Visual-Beefeater.jpg", "localesCsv": "57, 88"}];
const localesPorElemento = {"MINI CABECERA": ["182", "32", "36", "44", "45", "46", "49", "55", "58", "62", "71", "72", "73", "75", "76", "78", "79", "81", "83", "84", "85", "88", "89", "91", "92", "94", "96", "97", "99", "425", "426", "456", "457", "459", "518", "602", "607", "618", "620", "626", "632", "654", "655", "670", "679", "684", "686", "697", "736", "33", "38", "41", "42", "120", "682", "693", "747", "35", "48", "39", "57", "126", "127", "95", "98"], "LATERAL CABECERA CONGELADOS": ["57", "88"]};

const cardsRoot   = document.getElementById('cardsRoot');
const modal       = document.getElementById('modalLocales');
const lista       = document.getElementById('listaLocales');
const inputBuscar = document.getElementById('inputBuscar');
const btnClose    = document.getElementById('btnCloseModal');
const filtroGlobal= document.getElementById('filtroGlobal');

document.getElementById('providerName').textContent     = "Proveedor: " + (__PROVIDER__.proveedor || "Proveedor");
document.getElementById('providerVigencia').textContent = "Vigencia: " + (__PROVIDER__.vigencia || "Vigencia");

/* ==== FUNCIONES ==== */
function esImagen(url){ return url && /\.(jpg|jpeg|png|webp|gif)$/i.test(url); }
function previewImg(url){ return esImagen(url) ? `<img src="${url}" class="preview-img"/>` : ""; }

function linkBtn(url,label){
  if(url && url.startsWith("http")){
    return `<a href="${url}" target="_blank" class="btn">${label}</a>`;
  }
  return `<span class="btn disabled">No Adjunta</span>`;
}

/* ==== MODAL ==== */
function openLocales(arr){
  lista.innerHTML='';
  arr.forEach(l=>{
    const li=document.createElement('li');
    li.textContent='Local '+l;
    lista.appendChild(li);
  });
  modal.style.display='flex';
}
btnClose.onclick=()=> modal.style.display='none';

/* ==== RENDER ==== */
function renderCards(){
  const filtro=filtroGlobal.value.toLowerCase().trim();
  cardsRoot.innerHTML='';

  elementos.forEach(el=>{
    const locales=localesPorElemento[el.nombre]||[];
    if(filtro && !locales.some(l=>l.toLowerCase().includes(filtro))) return;

    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="grid-main">
        <div class="cell"><div class="label">Elemento</div><div class="value">${el.nombre}</div></div>
        <div class="cell"><div class="label">Medidas</div><div class="value">${el.medidas}</div></div>
        <div class="cell"><div class="label">Piezas</div><div class="value">${el.piezas||"-"}</div></div>
        <div class="cell"><div class="label">Zona</div><div class="value">${el.categoria}</div></div>

        <div class="cell">
          ${previewImg(el.fotomontaje)}
          ${linkBtn(el.fotomontaje,"Fotomontaje")}
        </div>
        <div class="cell">
          ${previewImg(el.keyvisual)}
          ${linkBtn(el.keyvisual,"Key Visual")}
        </div>
      </div>
      <div class="locales-row">
        <div class="locales-btn">Ver locales (${locales.length})</div>
      </div>
    `;
    card.querySelector('.locales-btn').onclick=()=>openLocales(locales);
    cardsRoot.appendChild(card);
  });
}

filtroGlobal.onkeyup=renderCards;
renderCards();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect – Sin Consolidado Vigente</title>
<link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/443725780191543307/1467618051267493899/00000177-6ab2-79ac-c358-bf17dd043159_1_preview_rev_1.png?ex=69810952&is=697fb7d2&hm=78a9c8f8627219468cf9d720095391557cf6ecd644dc110fc1cd2d35abcf26b2&">

<style>
:root {
  --primary:#0b2a6f;
  --bg:#e5e7eb;
  --panel:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
}

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.header{
  background:var(--primary);
  color:white;
  padding:14px 16px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.header img{
  height:26px;
  object-fit:contain;
}

# .wrapper{
#   flex:1;
#   display:flex;
#   align-items:center;
#   justify-content:center;
#   padding:20px;
# }

.wrapper{
  flex:1;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:70px 20px 20px;
}


.card{
  background:var(--panel);
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  max-width:520px;
  width:100%;
  padding:28px 22px;
  text-align:center;
}

.card h2{
  margin:0 0 12px;
  color:var(--primary);
  font-size:20px;
}

.card p{
  margin:8px 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}

.footer{
  text-align:center;
  font-size:12px;
  color:#9ca3af;
  padding:14px;
}

/* Responsive */
@media (min-width:768px){
  .card h2{font-size:22px;}
  .card p{font-size:15px;}
}
</style>
</head>

<body>

<div class="header">
  <img src="https://www.walmartconnect.com.mx/assets/home/logos/header-wm-large-icon.png" alt="Walmart Connect">
  <span>Walmart Connect · Consolidados</span>
</div>

<div class="wrapper">
  <div class="card">
    <h2>Hola estimado proveedor</h2>
    <p>
      Actualmente <strong>no tienes elementos aprobados</strong> para esta vigencia.
    </p>
    <p>
      Para más información por favor contacta al equipo de
      <strong>Operaciones de Walmart Connect</strong>
      o a tu <strong>Client Partner (CP)</strong>.
    </p>
  </div>
</div>

<div class="footer">
  Walmart Connect · Consolidados
</div>

</body>
</html>

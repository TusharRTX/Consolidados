<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect – Acceso</title>

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */
.header-bar {
  background: var(--primary);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-header {
  height: 34px;
  object-fit: contain;
}

/* WRAPPER */
.wrapper {
  max-width: 720px;
  margin: 40px auto;
  padding: 0 16px;
}

/* CARD CENTRAL */
.card {
  background: var(--panel);
  border-radius: 20px;
  box-shadow: 0 10px 28px rgba(0,0,0,.18);
  padding: 28px 22px;
  text-align: center;
}

.qr-icon {
  font-size: 54px;
  margin-bottom: 14px;
}

.title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

/* FOOTER MINI */
.footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 18px;
}
</style>
</head>

<body>

<header class="header-bar">
  <img 
    src="https://www.walmartconnect.com.mx/assets/home/logos/header-wm-large-icon.png"
    class="logo-header"
    alt="Walmart Connect"
  >

  <!--
  Si algún día quieres texto en vez del logo:
  <span style="color:white; font-weight:600;">Walmart Connect</span>
  -->
</header>

<div class="wrapper">
  <div class="card">

    <div class="qr-icon">📱</div>

    <div class="title">
      Hola Proveedor
    </div>

    <div class="subtitle">
      Recuerda escanear tu código QR para acceder<br>
      directamente a tu archivo de <b>Consolidado</b>.
      <br><br>
      Este enlace es solo informativo.
    </div>

  </div>

  <div class="footer">
    Walmart Connect · Plataforma de Consolidación
  </div>
</div>

</body>
</html>

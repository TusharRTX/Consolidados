<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect · Consolidados</title>

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

.header{
  background:var(--primary);
  color:white;
  padding:14px 16px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.header img{
  height:26px;
  object-fit:contain;
}

/* WRAPPER */
.wrapper {
  max-width: 720px;
  margin: 28px auto 0 auto; /* MÁS ARRIBA */
  padding: 70 16px;
}

/* CARD */
.card {
  background: var(--panel);
  border-radius: 20px;
  padding: 26px 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,.18);
  text-align: center;
}

.icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.text {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

.footer-text {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

@media (min-width: 768px) {
  .wrapper {
    margin-top: 40px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="https://cdn.discordapp.com/attachments/443725780191543307/1467618051267493899/00000177-6ab2-79ac-c358-bf17dd043159_1_preview_rev_1.png?ex=69810952&is=697fb7d2&hm=78a9c8f8627219468cf9d720095391557cf6ecd644dc110fc1cd2d35abcf26b2&" alt="Walmart Connect">
  <span>Walmart Connect · Consolidados</span>
</div>

<div class="wrapper">

  <div class="card">
    <div class="icon">📱</div>
    <div class="title">Hola Proveedor</div>
    <div class="text">
      Recuerda escanear tu código QR para acceder<br>
      directamente a tu archivo de <b>Consolidado</b>.
      <br><br>
      Este enlace es solo informativo.
    </div>
  </div>

  <div class="footer-text">
    Walmart Connect · Plataforma de Consolidación
  </div>

</div>

</body>
</html>

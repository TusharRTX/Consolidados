<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect · Consolidados</title>

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */
.header-bar {
  background: var(--primary);
  color: white;
  padding: 14px 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  position: relative;
}

/* LOGO */
.logo-header {
  height: 34px; /* MÁS GRANDE */
  object-fit: contain;
  margin-right: 8px;
}

/* TEXTO CENTRADO REAL */
.header-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 16px;
  white-space: nowrap;
}

/* WRAPPER */
.wrapper {
  max-width: 720px;
  margin: 28px auto 0 auto; /* MÁS ARRIBA */
  padding: 0 16px;
}

/* CARD */
.card {
  background: var(--panel);
  border-radius: 20px;
  padding: 26px 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,.18);
  text-align: center;
}

.icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.text {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

.footer-text {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

@media (min-width: 768px) {
  .wrapper {
    margin-top: 40px;
  }
}
</style>
</head>

<body>

<header class="header-bar">
  <img src="https://tusharrtx.github.io/Consolidados/connect.png" class="logo-header" alt="Logo">
  <div class="header-title">Walmart Connect · Consolidados</div>
</header>

<div class="wrapper">

  <div class="card">
    <div class="icon">📱</div>
    <div class="title">Hola Proveedor</div>
    <div class="text">
      Recuerda escanear tu código QR para acceder<br>
      directamente a tu archivo de <b>Consolidado</b>.
      <br><br>
      Este enlace es solo informativo.
    </div>
  </div>

  <div class="footer-text">
    Walmart Connect · Plataforma de Consolidación
  </div>

</div>

</body>
</html>

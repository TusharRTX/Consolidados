<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect · Acceso</title>

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
}

/* BASE */
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */
.header-bar {
  background: var(--primary);
  color: white;
  padding: 12px 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-header {
  height: 24px;
  object-fit: contain;
}

/* WRAPPER */
.wrapper {
  max-width: 720px;
  margin: 40px auto 0 auto; /* ← esto lo sube */
  padding: 0 16px;
}

/* CARD */
.card {
  background: var(--panel);
  border-radius: 22px;
  padding: 26px 22px;
  box-shadow: 0 14px 30px rgba(0,0,0,.18);
  text-align: center;
}

.icon {
  font-size: 44px;
  margin-bottom: 12px;
}

h1 {
  margin: 6px 0 10px 0;
  font-size: 22px;
}

p {
  margin: 6px 0;
  color: var(--muted);
  line-height: 1.4;
}

strong {
  color: var(--primary);
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
}

/* RESPONSIVE */
@media (min-height: 900px) {
  .wrapper {
    margin-top: 80px; /* pantallas grandes un poco más abajo */
  }
}

</style>
</head>

<body>

<header class="header-bar">
  <!-- Logo chico a la izquierda -->
  <img src="https://tusharrtx.github.io/Consolidados/connect.png" class="logo-header" alt="Logo">

  <!-- Texto principal -->
  <span>Walmart Connect · Consolidados</span>
</header>

<div class="wrapper">

  <div class="card">
    <div class="icon">📱</div>

    <h1>Hola Proveedor</h1>

    <p>
      Recuerda escanear tu código QR para acceder directamente
      a tu archivo de <strong>Consolidado</strong>.
    </p>

    <p>
      Este enlace es solo informativo.
    </p>
  </div>

  <div class="footer">
    Walmart Connect · Plataforma de Consolidación
  </div>

</div>

</body>
</html>

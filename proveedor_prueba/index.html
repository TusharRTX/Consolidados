<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect · Acceso</title>
<link rel="icon" type="image/png" href="https://media.discordapp.net/attachments/443725780191543307/1467586723159736380/connect_preview_rev_1.png">

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
}

/* BASE */
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header-bar {
  background: var(--primary);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-box {
  background: white;
  padding: 6px 14px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,.15);
}

.logo-header {
  height: 28px;
  object-fit: contain;
}

/* WRAPPER */
.wrapper {
  max-width: 720px;
  margin: auto;
  padding: 20px 16px;
  width: 100%;
}

/* CARD */
.card {
  background: var(--panel);
  border-radius: 22px;
  padding: 28px 22px;
  box-shadow: 0 14px 30px rgba(0,0,0,.18);
  text-align: center;
}

.icon {
  font-size: 46px;
  margin-bottom: 14px;
}

h1 {
  margin: 6px 0 10px 0;
  font-size: 22px;
}

p {
  margin: 6px 0;
  color: var(--muted);
  line-height: 1.4;
}

strong {
  color: var(--primary);
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
}

</style>
</head>

<body>

<header class="header-bar">
  <div class="logo-box">
    <img src="https://www.walmartconnect.com.mx/assets/home/logos/header-wm-large-icon.png"
         class="logo-header"
         alt="Walmart Connect">
  </div>

  <!--
  Si algún día quieres texto en vez de logo:
  <span style="color:white;font-weight:600;">Walmart Connect</span>
  -->
</header>

<div class="wrapper">

  <div class="card">
    <div class="icon">📱</div>

    <h1>Hola Proveedor</h1>

    <p>
      Recuerda escanear tu código QR para acceder directamente
      a tu archivo de <strong>Consolidado</strong>.
    </p>

    <p>
      Este enlace es solo informativo.
    </p>
  </div>

  <div class="footer">
    Walmart Connect · Plataforma de Consolidación
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect – Consolidados 2026</title>
<link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/443725780191543307/1467618051267493899/00000177-6ab2-79ac-c358-bf17dd043159_1_preview_rev_1.png?ex=69810952&is=697fb7d2&hm=78a9c8f8627219468cf9d720095391557cf6ecd644dc110fc1cd2d35abcf26b2&">

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --btn: #2563eb;
  --btn-disabled: #9ca3af;
  --locales-bg: #eef2ff;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); }
header { background: var(--primary); color: white; padding: 16px; text-align: center; font-weight: 600; }

.wrapper { max-width: 760px; margin: 20px auto; padding: 0 14px; }

.provider-bar {
  background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
  display: flex; flex-direction: column; gap: 6px;
}
.provider-name { font-weight: 700; }
.provider-date { font-size: 12px; color: var(--muted); }

.filtro-bar {
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: 0 6px 14px rgba(0,0,0,.12);
}

.filtro-bar input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 8px;
}

.filtro-bar select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.card {
  background: var(--panel);
  border-radius: 18px;
  box-shadow: 0 10px 26px rgba(0,0,0,.18);
  overflow: hidden;
  margin-bottom: 18px;
}

.grid-main { display: grid; grid-template-columns: 1fr 1fr; }

.cell {
  min-width: 0;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.grid-main > .cell:nth-child(odd) { border-right: 1px solid var(--border); }
.grid-main > .cell:nth-last-child(-n + 2) { border-bottom: none; }

.label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.value { font-weight: 600; }

.preview-img {
  width: 100%;
  max-height: 90px;
  object-fit: contain;
  margin-bottom: 6px;
  border-radius: 8px;
}

.btn {
  display: inline-block;
  width: 100%;
  padding: 8px;
  text-align: center;
  background: var(--btn);
  color: white;
  border-radius: 10px;
  font-weight: 600;
  font-size: 12px;
  text-decoration: none;
}

.btn.disabled {
  background: var(--btn-disabled);
  cursor: not-allowed;
}

.locales-row {
  border-top: 1px solid var(--border);
  padding: 14px;
}

.locales-btn {
  width: 100%;
  padding: 10px;
  background: var(--locales-bg);
  color: var(--primary);
  border-radius: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 1000;
  justify-content: center;
  align-items: flex-end;
}

.modal-content {
  background: white;
  width: 100%;
  max-height: 85vh;
  border-radius: 18px 18px 0 0;
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-weight: 600;
}

.modal-body {
  padding: 14px;
  overflow-y: auto;
}

.modal-body input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.locales-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.locales-list li {
  padding: 8px 4px;
  border-bottom: 1px solid var(--border);
}

.header-bar {
  background: var(--primary);
  color: white;
  padding: 12px 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.logo-header {
  height: 26px;
  object-fit: contain;
}
</style>
</head>

<body>

<header class="header-bar">
  <img src="https://www.walmartconnect.com.mx/assets/home/logos/header-wm-large-icon.png" class="logo-header">
  <span>Walmart Connect · Consolidado</span>
</header>

<div class="wrapper">

  <div class="provider-bar">
    <div class="provider-name" id="providerName">Proveedor</div>
    <div class="provider-date" id="providerVigencia">Vigencia</div>
  </div>

  <div class="filtro-bar">
    <input type="text" id="buscarLocalGlobal" placeholder="Escribir local..." />
    <select id="filtroGlobal"></select>
  </div>

  <div id="cardsRoot"></div>

</div>

<script>
const elementos = [{"nombre": "MINI CABECERA", "medidas": "MÁXIMO: 40x20x145 cm.", "piezas": 1, "categoria": "DULCE & PRESERVANTES", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/CZUQ9DE8oInv-Montaje_AMC_Walmart-QR.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/fUv29E3NkJDe-Montaje_AMC_Walmart-QR.jpg", "localesCsv": "32, 33, 35, 36, 38, 39, 42, 46, 62, 72, 73, 75, 76, 84, 88, 92, 98, 126, 182, 425, 426, 456, 602, 632, 682, 684"}];
const localesPorElemento = {"MINI CABECERA": ["32", "33", "35", "36", "38", "39", "42", "46", "62", "72", "73", "75", "76", "84", "88", "92", "98", "126", "182", "425", "426", "456", "602", "632", "682", "684"]};

const cardsRoot = document.getElementById('cardsRoot');
const selectLocal = document.getElementById('filtroGlobal');
const buscarLocalGlobal = document.getElementById('buscarLocalGlobal');

function extraerNumero(txt){
  const m = txt.toString().match(/\d+/);
  return m ? parseInt(m[0]) : 999999;
}
function ordenarLocales(a,b){
  const na = extraerNumero(a);
  const nb = extraerNumero(b);
  if(na !== nb) return na-nb;
  return a.localeCompare(b);
}

function construirSelectLocales(){
  const setLocales = new Set();
  Object.values(localesPorElemento).forEach(arr=> arr.forEach(l=> setLocales.add(l)));

  selectLocal.innerHTML = '<option value="">Todos los locales</option>';

  [...setLocales].sort(ordenarLocales).forEach(l=>{
    const op=document.createElement('option');
    op.value=l;
    op.textContent='Local '+l;
    selectLocal.appendChild(op);
  });
}

function filtrarSelectLocales(valor){
  valor = valor.toLowerCase();
  Array.from(selectLocal.options).forEach(op=>{
    if(op.value==="") return;
    op.style.display = op.textContent.toLowerCase().includes(valor) ? '' : 'none';
  });
}
buscarLocalGlobal.addEventListener('keyup', e=> filtrarSelectLocales(e.target.value));

function renderCards(){
  const filtro = selectLocal.value;
  cardsRoot.innerHTML='';

  elementos.forEach(el=>{
    const locales=localesPorElemento[el.nombre]||[];
    if(filtro && !locales.includes(filtro)) return;

    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<div>${el.nombre}</div>`;
    cardsRoot.appendChild(card);
  });
}

construirSelectLocales();
selectLocal.addEventListener('change', renderCards);
renderCards();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Walmart Connect – Consolidados 2026</title>
<link rel="icon" type="image/png" href="https://media.discordapp.net/attachments/443725780191543307/1467586723159736380/connect_preview_rev_1.png?ex=6980ec25&is=697f9aa5&hm=f751c790db33777077ea486d58b4f6750504c9d363962956a48538cb0c816d90&=&format=webp&quality=lossless">

<style>
:root {
  --primary: #0b2a6f;
  --bg: #d1d5db;
  --panel: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --btn: #2563eb;
  --btn-disabled: #9ca3af;
  --locales-bg: #eef2ff;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); }
header { background: var(--primary); color: white; padding: 16px; text-align: center; font-weight: 600; }

.wrapper { max-width: 760px; margin: 20px auto; padding: 0 14px; }

.provider-bar {
  background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
  display: flex; flex-direction: column; gap: 6px;
}
.provider-name { font-weight: 700; }
.provider-date { font-size: 12px; color: var(--muted); }

.filtro-bar {
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: 0 6px 14px rgba(0,0,0,.12);
}

.filtro-bar select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.card {
  background: var(--panel);
  border-radius: 18px;
  box-shadow: 0 10px 26px rgba(0,0,0,.18);
  overflow: hidden;
  margin-bottom: 18px;
}

.grid-main { display: grid; grid-template-columns: 1fr 1fr; }

.cell {
  min-width: 0;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.grid-main > .cell:nth-child(odd) { border-right: 1px solid var(--border); }
.grid-main > .cell:nth-last-child(-n + 2) { border-bottom: none; }

.label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.value { font-weight: 600; }

.preview-img {
  width: 100%;
  max-height: 90px;
  object-fit: contain;
  margin-bottom: 6px;
  border-radius: 8px;
}

.btn {
  display: inline-block;
  width: 100%;
  padding: 8px;
  text-align: center;
  background: var(--btn);
  color: white;
  border-radius: 10px;
  font-weight: 600;
  font-size: 12px;
  text-decoration: none;
}

.btn.disabled {
  background: var(--btn-disabled);
  cursor: not-allowed;
}

.locales-row {
  border-top: 1px solid var(--border);
  padding: 14px;
}

.locales-btn {
  width: 100%;
  padding: 10px;
  background: var(--locales-bg);
  color: var(--primary);
  border-radius: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 1000;
  justify-content: center;
  align-items: flex-end;
}

.modal-content {
  background: white;
  width: 100%;
  max-height: 85vh;
  border-radius: 18px 18px 0 0;
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-weight: 600;
}

.modal-body {
  padding: 14px;
  overflow-y: auto;
}

.modal-body input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.locales-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.locales-list li {
  padding: 8px 4px;
  border-bottom: 1px solid var(--border);
}

.logo-top {
  text-align: center;
  padding: 12px 0 0 0;
}

.logo-top img {
  max-height: 40px;
  object-fit: contain;
}

.close { font-size: 22px; cursor: pointer; }

@media (min-width: 769px) {
  .modal { align-items: center; }
  .modal-content { width: 520px; border-radius: 16px; }
}
</style>
</head>

<body>

<div class="logo-top">
  <img src="https://media.discordapp.net/attachments/443725780191543307/1467586723159736380/connect_preview_rev_1.png?ex=6980ec25&is=697f9aa5&hm=f751c790db33777077ea486d58b4f6750504c9d363962956a48538cb0c816d90&=&format=webp&quality=lossless" alt="Connect Logo">
</div>

<header>Walmart Connect · Consolidado</header>


<div class="wrapper">

  <div class="provider-bar">
    <div class="provider-name" id="providerName">Proveedor</div>
    <div class="provider-date" id="providerVigencia">Vigencia</div>
  </div>

  <div class="filtro-bar">
    <select id="filtroGlobal"></select>
  </div>

  <div id="cardsRoot"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modalLocales">
  <div class="modal-content">
    <div class="modal-header">
      <span>Locales asociados</span>
      <span class="close" id="btnCloseModal">×</span>
    </div>
    <div class="modal-body">
      <input type="text" id="inputBuscar" placeholder="Buscar local..." />
      <ul class="locales-list" id="listaLocales"></ul>
    </div>
  </div>
</div>

<script>
const __PROVIDER__       = {"proveedor": "DISTRIBUIDORA PISQUERA PORTUGAL", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)"};
const elementos          = [{"nombre": "SEPARADOR XL", "medidas": "MÁXIMO: 15x40 cm.", "piezas": 1, "categoria": "COCKTAIL", "vigencia": "Etapa 1 (08/01/26 → 10/02/26)", "fotomontaje": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/cvNyeJhlkrjz-MOCKUP-MG-SIPIRT-STOPPER-XL-WALMART.jpg", "keyvisual": "https://walmartconnect.cl/wp-content/uploads/forminator/818_69591769e92703498e05efc8dbca5e38/uploads/sqp31ihAKPOm-MOCKUP-MG-SIPIRT-STOPPER-XL-WALMART.jpg", "localesCsv": "3, 37, 41, 44, 45, 46, 48, 49, 55, 57, 73, 76, 80, 83, 85, 88, 95, 97, 182, 620, 626, 693, 736, 739, 748"}];
const localesPorElemento = {"SEPARADOR XL": ["3", "37", "41", "44", "45", "46", "48", "49", "55", "57", "73", "76", "80", "83", "85", "88", "95", "97", "182", "620", "626", "693", "736", "739", "748"]};

const cardsRoot   = document.getElementById('cardsRoot');
const modal       = document.getElementById('modalLocales');
const lista       = document.getElementById('listaLocales');
const inputBuscar = document.getElementById('inputBuscar');
const btnClose    = document.getElementById('btnCloseModal');
const selectLocal = document.getElementById('filtroGlobal');

document.getElementById('providerName').textContent     = "Proveedor: " + (__PROVIDER__.proveedor || "Proveedor");
document.getElementById('providerVigencia').textContent = "Vigencia: " + (__PROVIDER__.vigencia || "Vigencia");

/* PREVIEW */
function esImagen(url){ return url && /\.(jpg|jpeg|png|webp|gif)$/i.test(url); }
function previewImg(url){ return esImagen(url) ? `<img src="${url}" class="preview-img"/>` : ""; }

function linkBtn(url,label){
  if(url && url.startsWith("http")){
    return `<a href="${url}" target="_blank" class="btn">${label}</a>`;
  }
  return `<span class="btn disabled">No Adjunta</span>`;
}

/* MODAL */
function openLocales(arr){
  lista.innerHTML='';
  (arr || []).forEach(l=>{
    const li=document.createElement('li');
    li.textContent='Local '+l;
    lista.appendChild(li);
  });
  inputBuscar.value='';
  modal.style.display='flex';
  document.body.style.overflow='hidden';
}

function closeModal(){
  modal.style.display='none';
  document.body.style.overflow='';
}

function filterLocales(val){
  val=val.toLowerCase();
  document.querySelectorAll('#listaLocales li').forEach(li=>{
    li.style.display=li.textContent.toLowerCase().includes(val) ? '' : 'none';
  });
}

inputBuscar.addEventListener('keyup', e => filterLocales(e.target.value));
btnClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
});

/* SELECT LOCALES */
function construirSelectLocales(){
  const setLocales = new Set();
  Object.values(localesPorElemento).forEach(arr=> arr.forEach(l=> setLocales.add(l)));

  selectLocal.innerHTML = '<option value="">Todos los locales</option>';

  [...setLocales].sort().forEach(l=>{
    const op=document.createElement('option');
    op.value=l;
    op.textContent='Local '+l;
    selectLocal.appendChild(op);
  });
}

/* RENDER */
function renderCards(){
  const filtro = selectLocal.value;
  cardsRoot.innerHTML='';

  elementos.forEach(el=>{
    const locales=localesPorElemento[el.nombre]||[];
    if(filtro && !locales.includes(filtro)) return;

    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="grid-main">
        <div class="cell"><div class="label">Elemento</div><div class="value">${el.nombre}</div></div>
        <div class="cell"><div class="label">Medidas</div><div class="value">${el.medidas}</div></div>
        <div class="cell"><div class="label">Piezas</div><div class="value">${el.piezas ? el.piezas + " por local" : "-"}</div></div>
        <div class="cell"><div class="label">Zona</div><div class="value">${el.categoria || "No Adjunta"}</div></div>

        <div class="cell">
          ${previewImg(el.fotomontaje)}
          ${linkBtn(el.fotomontaje,"Fotomontaje")}
        </div>
        <div class="cell">
          ${previewImg(el.keyvisual)}
          ${linkBtn(el.keyvisual,"Key Visual")}
        </div>
      </div>
      <div class="locales-row">
        <div class="locales-btn">Ver locales (${locales.length})</div>
      </div>
    `;

    card.querySelector('.locales-btn').onclick=()=>openLocales(locales);
    cardsRoot.appendChild(card);
  });
}

/* INIT */
construirSelectLocales();
selectLocal.addEventListener('change', renderCards);
renderCards();
</script>

</body>
</html>
